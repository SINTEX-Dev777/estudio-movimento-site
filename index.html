<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estúdio Movimento | Vídeos e fotos para moda + Loja Dry Fit</title>
  <meta name="description" content="Produção de vídeos e fotos com modelos para marcas de roupa e loja de camisas e shorts Dry Fit. Peça pelo WhatsApp.">
  <meta name="theme-color" content="#0E0F12">

  <!-- Compartilhamento (WhatsApp, Instagram, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Estúdio Movimento | Vídeos e fotos para moda + Loja Dry Fit">
  <meta property="og:description" content="Vídeos e fotos com modelos que mostram caimento, tecido e elasticidade. E camisas e shorts Dry Fit.">
  <meta property="og:image" content="/icones/icone-512.png">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary">

  <!-- Ícones e instalação no celular -->
  <link rel="icon" href="/icones/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icones/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movimento">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Estúdio Movimento",
    "description": "Produção de vídeos e fotos com modelos para marcas de roupa e loja de roupas Dry Fit.",
    "areaServed": "BR"
  }
  </script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div class="faixa-demo" id="faixaDemo" hidden>
    Modo demonstração: preços, textos, fotos e contatos são de <strong>exemplo</strong>.
  </div>

  <header class="topo">
    <div class="topo__in">
      <a class="marca" href="#inicio" aria-label="Ir para o início">
        <img src="/icones/favicon.svg" alt="" width="34" height="34">
        <span class="marca__nome" id="marcaNome">Estúdio Movimento</span>
      </a>

      <nav class="abas" aria-label="Seções do site">
        <a href="#inicio" data-aba="inicio">Início</a>
        <a href="#catalogos" data-aba="catalogos">Catálogos</a>
        <a href="#fotos" data-aba="fotos">Fotos</a>
        <a href="#videos" data-aba="videos">Vídeos</a>
        <a href="#loja" data-aba="loja" class="abas__loja">Loja Dry Fit</a>
      </nav>

      <div class="topo__acoes">
        <button class="btn-icone" id="btnInstalarTopo" type="button" hidden aria-label="Instalar o app no celular">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14"/></svg>
        </button>
        <button class="btn-icone carrinho-btn" id="btnCarrinho" type="button" aria-label="Abrir pedido (0 itens)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1.2 11.1a2 2 0 0 1-2 1.9H9.2a2 2 0 0 1-2-1.9z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="carrinho-btn__qtd" id="carrinhoQtd" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <!-- Carregando -->
    <div class="carregando" id="carregando" aria-live="polite">
      <div class="esqueleto esqueleto--hero"></div>
      <div class="grade grade--4">
        <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
      </div>
    </div>

    <section class="aba" id="aba-inicio" data-aba-conteudo="inicio" hidden></section>
    <section class="aba" id="aba-catalogos" data-aba-conteudo="catalogos" hidden></section>
    <section class="aba" id="aba-fotos" data-aba-conteudo="fotos" hidden></section>
    <section class="aba" id="aba-videos" data-aba-conteudo="videos" hidden></section>
    <section class="aba" id="aba-loja" data-aba-conteudo="loja" hidden></section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <!-- Navegação inferior (celular) -->
  <nav class="nav-baixo" aria-label="Seções do site (celular)">
    <a href="#inicio" data-aba="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
    <a href="#catalogos" data-aba="catalogos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Catálogos</span></a>
    <a href="#fotos" data-aba="fotos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg><span>Fotos</span></a>
    <a href="#videos" data-aba="videos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Vídeos</span></a>
    <a href="#loja" data-aba="loja"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 4 6.5 5.5 10 7 9.3V20h10V9.3l1.5.7L20 6.5 16 4a4 4 0 0 1-8 0z"/></svg><span>Loja</span></a>
  </nav>

  <!-- Botão flutuante de WhatsApp -->
  <a class="zap-flutuante" id="zapFlutuante" href="#" target="_blank" rel="noopener" aria-label="Conversar no WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8.9 3.8.8a3.3 3.3 0 0 0 2.1-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.1-.3-.2-.6-.4z"/></svg>
  </a>

  <!-- Janela de detalhes (produto ou serviço) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" hidden>
    <div class="modal__fundo" data-fechar></div>
    <div class="modal__caixa" tabindex="-1">
      <button class="modal__fechar btn-icone" type="button" data-fechar aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="modal__corpo" id="modalCorpo"></div>
    </div>
  </div>

  <!-- Visualizador de fotos -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotos" hidden>
    <button class="lightbox__btn lightbox__fechar" type="button" data-lb="fechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="lightbox__btn lightbox__ant" type="button" data-lb="ant" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <figure class="lightbox__fig">
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxLegenda"></figcaption>
    </figure>
    <button class="lightbox__btn lightbox__prox" type="button" data-lb="prox" aria-label="Próxima foto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </button>
  </div>

  <!-- Pedido (carrinho) -->
  <aside class="gaveta" id="gaveta" aria-labelledby="gavetaTitulo" hidden>
    <div class="gaveta__fundo" data-fechar-gaveta></div>
    <div class="gaveta__caixa" role="dialog" aria-modal="true" aria-labelledby="gavetaTitulo" tabindex="-1">
      <div class="gaveta__topo">
        <h2 id="gavetaTitulo">Seu pedido</h2>
        <button class="btn-icone" type="button" data-fechar-gaveta aria-label="Fechar pedido">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="gaveta__corpo" id="gavetaCorpo"></div>
    </div>
  </aside>

  <!-- Aviso de instalação -->
  <div class="instalar" id="avisoInstalar" role="dialog" aria-labelledby="instalarTitulo" hidden>
    <img src="/icones/icone-192.png" alt="" width="48" height="48">
    <div class="instalar__texto">
      <strong id="instalarTitulo">Instale o app no seu celular</strong>
      <span id="instalarDica">Acesso rápido aos catálogos e à loja, direto da tela inicial.</span>
    </div>
    <div class="instalar__acoes">
      <button class="btn btn--primario btn--peq" type="button" id="btnInstalar">Instalar</button>
      <button class="btn-texto" type="button" id="btnInstalarDepois">Agora não</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Ative o JavaScript do navegador para ver os catálogos e a loja.</p></noscript>

  <script src="/js/app.js" defer></script>
</body>
</html>
